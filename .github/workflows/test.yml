name: Test

# Reusable — called by ci.yml (every push/PR) and deploy.yml (gates the
# production deploy). Keeping it in one place means both always run the
# exact same checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: PHP 7.4 — Vitest + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Laravel 5.2's migrations are MySQL-flavoured, so the suite needs a real
    # MySQL rather than SQLite.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: carta
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # 7.4 is the newest PHP this codebase runs on: Laravel 5.2 uses
      # constructs removed in PHP 8.
      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring, pdo_mysql, gd, zip, dom, xml, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        # --no-scripts skips the post-install artisan hooks, which need a
        # configured app that does not exist yet at this point.
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure the environment
        run: |
          cp .env.example .env
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|"     .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=carta|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=root|"  .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=root|"  .env
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Build the schema and demo data
        # The end-to-end tests assert against the seeded catalogue, so this is
        # a prerequisite, not a convenience.
        run: php artisan migrate --seed --force

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        # playwright.config.js starts the app itself via ./run-local.sh, which
        # picks up the runner's PHP from PATH.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-log
          path: storage/logs/laravel.log
          retention-days: 7
          if-no-files-found: ignore
